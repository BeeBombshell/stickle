<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f1f23" stroke-width="1"/>
    </pattern>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#09090b"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.8"/>

  <circle cx="950" cy="200" r="350" fill="#ffffff" opacity="0.03" filter="url(#glow)"/>
  <circle cx="250" cy="450" r="300" fill="#ffffff" opacity="0.02" filter="url(#glow)"/>

  <g transform="translate(80, 70)">
    <rect width="44" height="44" rx="10" fill="#111111"/>
    <circle cx="31" cy="31" r="9" fill="#e4f579"/>
    <circle cx="31" cy="31" r="3.5" fill="#111111"/>

    <text x="58" y="32" class="font-sans" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-1.2">stickle</text>
    <line x1="172" y1="10" x2="172" y2="34" stroke="#27272a" stroke-width="1.5"/>

    <rect x="188" y="8" width="170" height="28" rx="14" fill="#e4f579"/>
    <text x="273" y="26" class="font-mono" font-size="11" font-weight="700" fill="#111111" letter-spacing="1" text-anchor="middle">WEB DASHBOARD</text>
  </g>

  <g transform="translate(80, 175)">
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#e4f579"/>
    <text x="110" y="18" class="font-mono" font-size="11" font-weight="700" fill="#111111" letter-spacing="1" text-anchor="middle">LOCAL-FIRST WEB ANCHORING</text>

    <text x="0" y="85" class="font-sans" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="-2.2">Leave notes in the</text>
    <text x="0" y="145" class="font-sans" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="-2.2">margins of the web.</text>

    <text x="0" y="200" class="font-sans" font-size="20" font-weight="400" fill="#a1a1aa" letter-spacing="-0.2">Anchor persistent floating sticky notes to dynamic web content.</text>
    <text x="0" y="230" class="font-sans" font-size="20" font-weight="400" fill="#a1a1aa" letter-spacing="-0.2">Reload-proof · Zero tracking · Single-click Notion sync.</text>

    <g transform="translate(0, 275)">
      <rect x="0" y="0" width="190" height="38" rx="19" fill="#e4f579"/>
      <text x="95" y="24" class="font-sans" font-size="13" font-weight="600" fill="#111111" text-anchor="middle">DOM Element Anchoring</text>

      <rect x="202" y="0" width="160" height="38" rx="19" fill="#e4f579"/>
      <text x="282" y="24" class="font-sans" font-size="13" font-weight="600" fill="#111111" text-anchor="middle">1-Click Notion Sync</text>

      <rect x="374" y="0" width="140" height="38" rx="19" fill="#e4f579"/>
      <text x="444" y="24" class="font-sans" font-size="13" font-weight="600" fill="#111111" text-anchor="middle">100% Local DB</text>
    </g>
  </g>

  <g transform="translate(670, 110)" filter="url(#shadow)">
    <rect x="0" y="0" width="450" height="420" rx="16" fill="#111114" stroke="#27272a" stroke-width="1.5"/>
    
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 434 0 A 16 16 0 0 1 450 16 L 450 42 L 0 42 Z" fill="#18181c"/>
    <circle cx="20" cy="21" r="5" fill="#3f3f46"/>
    <circle cx="36" cy="21" r="5" fill="#3f3f46"/>
    <circle cx="52" cy="21" r="5" fill="#3f3f46"/>
    
    <rect x="76" y="10" width="290" height="22" rx="6" fill="#09090b"/>
    <text x="221" y="25" class="font-mono" font-size="11" fill="#71717a" text-anchor="middle">stickle.app/notes</text>

    <rect x="30" y="65" width="220" height="16" rx="4" fill="#27272a"/>
    <rect x="30" y="93" width="340" height="10" rx="3" fill="#1f1f23"/>
    <rect x="30" y="111" width="290" height="10" rx="3" fill="#1f1f23"/>
    <rect x="30" y="129" width="310" height="10" rx="3" fill="#1f1f23"/>

    <rect x="30" y="160" width="390" height="70" rx="8" fill="#18181c" stroke="#e4f579" stroke-width="1.5" stroke-dasharray="4 4"/>
    <rect x="45" y="178" width="140" height="12" rx="3" fill="#ffffff" opacity="0.8"/>
    <rect x="45" y="198" width="240" height="8" rx="2" fill="#71717a"/>
    <circle cx="395" cy="195" r="10" fill="#e4f579"/>
    <circle cx="395" cy="195" r="4" fill="#111111"/>

    <g transform="translate(140, 185) rotate(-3)" filter="url(#shadow)">
      <rect width="250" height="135" rx="10" fill="#e4f579"/>
      <path d="M 0 10 A 10 10 0 0 1 10 0 L 240 0 A 10 10 0 0 1 250 10 L 250 32 L 0 32 Z" fill="#d4e65b"/>
      <text x="14" y="21" class="font-mono" font-size="11" font-weight="700" fill="#111111">#pricing-table</text>
      <text x="226" y="21" class="font-sans" font-size="14" font-weight="600" fill="#111111">×</text>
      <text x="14" y="55" class="font-sans" font-size="13" font-weight="600" fill="#111111">Double check tier limits</text>
      <text x="14" y="73" class="font-sans" font-size="13" font-weight="600" fill="#111111">before tomorrow's launch!</text>
      <text x="14" y="112" class="font-mono" font-size="10" font-weight="600" fill="#4a5700">Anchored · Resilient Tier 2</text>
    </g>

    <g transform="translate(40, 260) rotate(2)" filter="url(#shadow)">
      <rect width="240" height="120" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
      <path d="M 0 10 A 10 10 0 0 1 10 0 L 230 0 A 10 10 0 0 1 240 10 L 240 30 L 0 30 Z" fill="#f4f4f5"/>
      <text x="12" y="20" class="font-mono" font-size="11" font-weight="700" fill="#18181b">Notion Database Sync</text>
      <text x="12" y="50" class="font-sans" font-size="13" font-weight="500" fill="#18181b">Synced automatically to</text>
      <text x="12" y="68" class="font-sans" font-size="13" font-weight="500" fill="#18181b">Notion workspace</text>
      <text x="12" y="100" class="font-mono" font-size="10" fill="#71717a">Just now · 1-click sync</text>
    </g>
  </g>

  <g transform="translate(80, 570)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#1f1f23" stroke-width="1"/>
    <text x="0" y="26" class="font-mono" font-size="12" fill="#71717a">https://stickle.app/notes</text>
    <text x="520" y="26" class="font-mono" font-size="12" fill="#52525b" text-anchor="middle">Central Web Dashboard · Search, Sort &amp; Timeline Views</text>
    <text x="1040" y="26" class="font-mono" font-size="12" fill="#71717a" text-anchor="end">v0.1.0 Release</text>
  </g>
</svg>
