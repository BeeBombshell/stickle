<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1c1c20" stroke-width="1"/>
    </pattern>

    <!-- Font Family Declarations -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');
      .font-sans { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>

    <!-- Ambient Glow Filter -->
    <filter id="glow-lime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-lilac" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadows -->
    <filter id="shadow-card" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="shadow-note" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="630" fill="#09090b"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.85"/>

  <!-- Vibrant Background Ambient Spotlights -->
  <circle cx="980" cy="180" r="280" fill="#e4f579" opacity="0.07" filter="url(#glow-lime)"/>
  <circle cx="1100" cy="460" r="260" fill="#e8d5ff" opacity="0.08" filter="url(#glow-lilac)"/>
  <circle cx="200" cy="500" r="240" fill="#93c5fd" opacity="0.05" filter="url(#glow-lime)"/>

  <!-- ================= LEFT HERO COLUMN ================= -->
  <!-- Top Brand Lockup -->
  <g transform="translate(72, 64)">
    <!-- Stickle Icon (Dark on Light) -->
    <rect width="44" height="44" rx="11" fill="#ffffff"/>
    <circle cx="31" cy="31" r="9" fill="#09090b"/>
    <circle cx="31" cy="31" r="3.5" fill="#ffffff"/>

    <!-- Wordmark -->
    <text x="58" y="32" class="font-sans" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-1.2">stickle</text>
    
    <!-- Divider -->
    <line x1="170" y1="11" x2="170" y2="33" stroke="#27272a" stroke-width="1.5"/>

    <!-- Eyebrow Badge (Lime Pill) -->
    <rect x="186" y="8" width="180" height="28" rx="14" fill="#e4f579"/>
    <text x="276" y="26" class="font-mono" font-size="11" font-weight="700" fill="#09090b" letter-spacing="1" text-anchor="middle">CHROME EXTENSION</text>
  </g>

  <!-- Main Headline Block -->
  <g transform="translate(72, 172)">
    <!-- Eyebrow Chip -->
    <rect x="0" y="0" width="224" height="28" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#e4f579"/>
    <text x="26" y="18" class="font-mono" font-size="11" font-weight="700" fill="#d4d4d8" letter-spacing="0.8">LOCAL-FIRST ANCHORING</text>

    <!-- Giant Confident Display Headline -->
    <text x="0" y="86" class="font-sans" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-2.2">Leave notes in the</text>
    <text x="0" y="148" class="font-sans" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-2.2">margins of the web.</text>

    <!-- Subtitle -->
    <text x="0" y="206" class="font-sans" font-size="19" font-weight="400" fill="#a1a1aa" letter-spacing="-0.2">Anchor persistent floating sticky notes directly to web elements.</text>
    <text x="0" y="234" class="font-sans" font-size="19" font-weight="400" fill="#a1a1aa" letter-spacing="-0.2">Survives page reloads · Zero tracking · 1-click Notion sync.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 276)">
      <!-- Pill 1: 5-Tier Engine -->
      <rect x="0" y="0" width="188" height="38" rx="19" fill="#e4f579"/>
      <text x="94" y="24" class="font-sans" font-size="13" font-weight="700" fill="#09090b" text-anchor="middle">⚡️ 5-Tier DOM Engine</text>

      <!-- Pill 2: Notion Sync -->
      <rect x="200" y="0" width="168" height="38" rx="19" fill="#e8d5ff"/>
      <text x="284" y="24" class="font-sans" font-size="13" font-weight="700" fill="#18181b" text-anchor="middle">📌 Notion Integration</text>

      <!-- Pill 3: Local Dexie -->
      <rect x="380" y="0" width="144" height="38" rx="19" fill="#18181b" stroke="#3f3f46" stroke-width="1.2"/>
      <text x="452" y="24" class="font-sans" font-size="13" font-weight="600" fill="#f4f4f5" text-anchor="middle">🔒 Local IndexedDB</text>
    </g>
  </g>

  <!-- ================= RIGHT UI MOCKUP COLUMN ================= -->
  <g transform="translate(650, 92)" filter="url(#shadow-card)">
    <!-- Browser Window Card -->
    <rect x="0" y="0" width="480" height="438" rx="18" fill="#111114" stroke="#27272a" stroke-width="1.5"/>
    
    <!-- Browser Header Bar -->
    <path d="M 0 18 A 18 18 0 0 1 18 0 L 462 0 A 18 18 0 0 1 480 18 L 480 44 L 0 44 Z" fill="#18181c"/>
    <circle cx="22" cy="22" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="38" cy="22" r="5" fill="#eab308" opacity="0.8"/>
    <circle cx="54" cy="22" r="5" fill="#22c55e" opacity="0.8"/>
    
    <!-- Address URL Bar -->
    <rect x="80" y="11" width="310" height="23" rx="7" fill="#09090b" stroke="#27272a" stroke-width="1"/>
    <circle cx="95" cy="22.5" r="3" fill="#e4f579"/>
    <text x="245" y="27" class="font-mono" font-size="11" font-weight="500" fill="#a1a1aa" text-anchor="middle">https://docs.github.com/en/get-started</text>

    <!-- Simulated Page Content Lines -->
    <g transform="translate(32, 66)">
      <!-- Main Page Title Line -->
      <rect x="0" y="0" width="240" height="18" rx="4" fill="#f4f4f5"/>
      <rect x="0" y="28" width="380" height="10" rx="3" fill="#27272a"/>
      <rect x="0" y="46" width="330" height="10" rx="3" fill="#27272a"/>
      
      <!-- DOM Anchor Target Box (Dotted Outline with Target Anchor Pin) -->
      <rect x="0" y="74" width="416" height="76" rx="10" fill="#18181c" stroke="#e4f579" stroke-width="1.5" stroke-dasharray="5 5"/>
      <rect x="18" y="92" width="160" height="14" rx="4" fill="#e4f579" opacity="0.9"/>
      <rect x="18" y="116" width="280" height="9" rx="3" fill="#52525b"/>

      <!-- Anchor Pin Icon on Target -->
      <circle cx="390" cy="112" r="12" fill="#e4f579"/>
      <circle cx="390" cy="112" r="5" fill="#09090b"/>
      <text x="366" y="140" class="font-mono" font-size="9" font-weight="700" fill="#e4f579">DOM ANCHOR</text>
    </g>

    <!-- ========= REAL STICKLE NOTE 1: LIME PASTEL ========= -->
    <g transform="translate(150, 168) rotate(-3.5)" filter="url(#shadow-note)">
      <!-- Note Container -->
      <rect width="286" height="152" rx="12" fill="#e4f579" stroke="#d4e65b" stroke-width="1.5"/>
      
      <!-- Note Header Bar -->
      <path d="M 0 12 A 12 12 0 0 1 12 0 L 274 0 A 12 12 0 0 1 286 12 L 286 36 L 0 36 Z" fill="#d9ec6b"/>
      
      <!-- Drag Grip Handle Dots (6 dots) -->
      <circle cx="16" cy="15" r="1.5" fill="#4a5700"/>
      <circle cx="21" cy="15" r="1.5" fill="#4a5700"/>
      <circle cx="16" cy="21" r="1.5" fill="#4a5700"/>
      <circle cx="21" cy="21" r="1.5" fill="#4a5700"/>
      
      <!-- Tag / Location -->
      <text x="32" y="22" class="font-mono" font-size="11" font-weight="700" fill="#18181b">#research · h1.title</text>
      
      <!-- Close Button -->
      <circle cx="268" cy="18" r="8" fill="#cbe056"/>
      <text x="268" y="22" class="font-sans" font-size="12" font-weight="700" fill="#18181b" text-anchor="middle">×</text>
      
      <!-- Note Body Text -->
      <text x="16" y="62" class="font-sans" font-size="13.5" font-weight="600" fill="#09090b" letter-spacing="-0.1">Alt + Click anchored this note</text>
      <text x="16" y="82" class="font-sans" font-size="13.5" font-weight="600" fill="#09090b" letter-spacing="-0.1">directly to the heading element.</text>
      <text x="16" y="102" class="font-sans" font-size="13.5" font-weight="600" fill="#09090b" letter-spacing="-0.1">Survives reloads &amp; DOM shifts!</text>
      
      <!-- Footer Badges -->
      <rect x="16" y="122" width="118" height="20" rx="10" fill="#09090b"/>
      <text x="75" y="136" class="font-mono" font-size="9.5" font-weight="700" fill="#e4f579" text-anchor="middle">5-TIER FINGERPRINT</text>

      <rect x="140" y="122" width="98" height="20" rx="10" fill="#ffffff" opacity="0.9"/>
      <text x="189" y="136" class="font-mono" font-size="9.5" font-weight="700" fill="#18181b" text-anchor="middle">📌 Notion Sync</text>
    </g>

    <!-- ========= REAL STICKLE NOTE 2: LILAC PASTEL ========= -->
    <g transform="translate(36, 260) rotate(3)" filter="url(#shadow-note)">
      <!-- Note Container -->
      <rect width="270" height="136" rx="12" fill="#e8d5ff" stroke="#d8bdf8" stroke-width="1.5"/>
      
      <!-- Note Header Bar -->
      <path d="M 0 12 A 12 12 0 0 1 12 0 L 258 0 A 12 12 0 0 1 270 12 L 270 34 L 0 34 Z" fill="#ddc3f7"/>
      
      <!-- Drag Grip Handle Dots -->
      <circle cx="16" cy="14" r="1.5" fill="#4c1d95"/>
      <circle cx="21" cy="14" r="1.5" fill="#4c1d95"/>
      <circle cx="16" cy="20" r="1.5" fill="#4c1d95"/>
      <circle cx="21" cy="20" r="1.5" fill="#4c1d95"/>
      
      <text x="32" y="21" class="font-mono" font-size="11" font-weight="700" fill="#2e1065">Notion Workspace Sync</text>
      
      <!-- Note Body Text -->
      <text x="16" y="58" class="font-sans" font-size="13" font-weight="600" fill="#1e1b4b">Exported 8 notes to Notion</text>
      <text x="16" y="78" class="font-sans" font-size="13" font-weight="600" fill="#1e1b4b">with URL, tags &amp; DOM anchor.</text>
      
      <!-- Footer Badge -->
      <rect x="16" y="104" width="102" height="20" rx="10" fill="#2e1065"/>
      <text x="67" y="118" class="font-mono" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">SYNCED TO CLOUD</text>

      <text x="254" y="118" class="font-mono" font-size="10" font-weight="600" fill="#5b21b6" text-anchor="end">Just now</text>
    </g>
  </g>

  <!-- ================= BOTTOM STATUS FOOTER ================= -->
  <g transform="translate(72, 566)">
    <line x1="0" y1="0" x2="1056" y2="0" stroke="#27272a" stroke-width="1"/>
    <!-- Official Domain -->
    <text x="0" y="28" class="font-mono" font-size="13" font-weight="600" fill="#e4f579">https://stickle.beebombshell.com</text>
    <text x="528" y="28" class="font-mono" font-size="12" font-weight="500" fill="#71717a" text-anchor="middle">Local-First Web Annotation · Dexie IndexedDB · 5-Tier DOM Anchoring Engine</text>
    <text x="1056" y="28" class="font-mono" font-size="12" font-weight="700" fill="#a1a1aa" text-anchor="end">v1.0 (Chrome MV3)</text>
  </g>
</svg>
