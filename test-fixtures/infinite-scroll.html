<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Infinite Scroll Fixture — Stickle Testing</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    .feed-item { padding: 20px; margin-bottom: 20px; background: #f5f5f3; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Social Feed Simulator</h1>
  <div id="feed">
    <div class="feed-item" id="item-1">Feed Item #1 — Initial Post</div>
    <div class="feed-item" id="item-2">Feed Item #2 — Initial Post</div>
  </div>

  <script>
    let itemCount = 2;
    window.addEventListener('scroll', () => {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 100) {
        itemCount++;
        const newItem = document.createElement('div');
        newItem.className = 'feed-item';
        newItem.id = `item-${itemCount}`;
        newItem.textContent = `Feed Item #${itemCount} — Dynamically Loaded Content`;
        document.getElementById('feed').appendChild(newItem);
      }
    });
  </script>
</body>
</html>
