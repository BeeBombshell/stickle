<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SPA Re-render Fixture — Stickle Testing</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
  </style>
</head>
<body>
  <h1>Dynamic SPA Page</h1>
  <div id="app-root">
    <p>Initial render before dynamic state update...</p>
  </div>
  <button id="rerender-btn">Re-render DOM Tree</button>

  <script>
    document.getElementById('rerender-btn').addEventListener('click', () => {
      document.getElementById('app-root').innerHTML = `
        <div class="dynamic-wrapper">
          <p class="content-body">
            Re-rendered paragraph simulating React/Preact DOM mutation.
          </p>
        </div>
      `;
    });
  </script>
</body>
</html>
