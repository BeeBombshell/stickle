<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Stickle — Leave notes in the margins of the web</title>
    <meta name="title" content="Stickle — Leave notes in the margins of the web" />
    <meta
      name="description"
      content="Stickle is a local-first Chrome extension that lets you drop floating sticky notes anywhere on any webpage. Notes stay pinned through reloads, re-renders, and sync to Notion in one click."
    />
    <meta name="google-site-verification" content="iztnXGKuIWicmeU4IWIBTxJGwWz_ubRViANYbmH_oAw" />
    <meta name="theme-color" content="#09090b" />

    <!-- Favicon & Header Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon/16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/128.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stickle.beebombshell.com/" />
    <meta property="og:site_name" content="Stickle" />
    <meta property="og:title" content="Stickle — Leave notes in the margins of the web" />
    <meta
      property="og:description"
      content="Stickle is a local-first Chrome extension that lets you drop floating sticky notes anywhere on any webpage. Reload-proof, zero tracking, single-click Notion sync."
    />
    <meta property="og:image" content="https://stickle.beebombshell.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://stickle.beebombshell.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stickle — Web Note Anchoring" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://stickle.beebombshell.com/" />
    <meta name="twitter:title" content="Stickle — Leave notes in the margins of the web" />
    <meta
      name="twitter:description"
      content="Stickle is a local-first Chrome extension that lets you drop floating sticky notes anywhere on any webpage. Reload-proof, zero tracking, single-click Notion sync."
    />
    <meta name="twitter:image" content="https://stickle.beebombshell.com/og-image.png" />
    <meta name="twitter:image:alt" content="Stickle — Web Note Anchoring" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter variable font for authentic weight-axis typography (DESIGN.md) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; }

      /* ── Sync-Flow Animation ── */
      @keyframes syncNoteFloat {
        0%   { transform: translate(0, 0) scale(1); opacity: 1; }
        60%  { opacity: 1; }
        100% { transform: var(--tx, 80px) var(--ty, -60px) scale(0.72); opacity: 0; }
      }
      @keyframes syncNoteAppear {
        0%   { transform: scale(0.6); opacity: 0; }
        60%  { transform: scale(1.12); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes syncTargetPulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(228,245,121,0); }
        50%       { box-shadow: 0 0 0 8px rgba(228,245,121,0.18); }
      }
      @keyframes syncTargetPulse2 {
        0%, 100% { box-shadow: 0 0 0 0 rgba(228,245,121,0); }
        50%       { box-shadow: 0 0 0 8px rgba(228,245,121,0.25); }
      }
      @keyframes syncTargetPulse3 {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
        50%       { box-shadow: 0 0 0 8px rgba(255,255,255,0.2); }
      }
      @keyframes syncNoteBob {
        0%, 100% { transform: translateY(0px) rotate(-2deg); }
        50%       { transform: translateY(-6px) rotate(2deg); }
      }
      @keyframes syncNoteWiggle {
        0%, 100% { transform: translateY(0px) rotate(1deg); }
        50%       { transform: translateY(-5px) rotate(-3deg); }
      }
      @keyframes syncNoteWiggle2 {
        0%, 100% { transform: translateY(0px) rotate(-3deg); }
        50%       { transform: translateY(-7px) rotate(1deg); }
      }
      @keyframes syncFlyToNotion {
        0%   { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(140px, -60px) scale(0.5); opacity: 0; }
      }
      @keyframes syncFlyToObsidian {
        0%   { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(160px, 20px) scale(0.5); opacity: 0; }
      }
      @keyframes syncFlyToAI {
        0%   { transform: translate(0, 0) scale(1); opacity: 1; }
        100% { transform: translate(130px, 80px) scale(0.5); opacity: 0; }
      }
      @keyframes syncCheckIn {
        0%   { transform: scale(0); opacity: 0; }
        70%  { transform: scale(1.3); }
        100% { transform: scale(1); opacity: 1; }
      }
      @keyframes syncConnectorPulse {
        0%, 100% { stroke-dashoffset: 60; opacity: 0.4; }
        50%       { stroke-dashoffset: 0;  opacity: 1; }
      }
      @keyframes syncGlowPulse {
        0%, 100% { opacity: 0.12; transform: scale(1); }
        50%       { opacity: 0.22; transform: scale(1.08); }
      }

      .sync-note-1 { animation: syncNoteBob 3.2s ease-in-out infinite; }
      .sync-note-2 { animation: syncNoteWiggle 2.8s ease-in-out infinite 0.6s; }
      .sync-note-3 { animation: syncNoteWiggle2 3.6s ease-in-out infinite 1.2s; }
      .sync-glow   { animation: syncGlowPulse 3s ease-in-out infinite; }

      .sync-fly-1 { animation: syncFlyToNotion 1.8s cubic-bezier(.4,0,.2,1) infinite; animation-delay: 0s; }
      .sync-fly-2 { animation: syncFlyToObsidian 1.8s cubic-bezier(.4,0,.2,1) infinite; animation-delay: 1.2s; }
      .sync-fly-3 { animation: syncFlyToAI 1.8s cubic-bezier(.4,0,.2,1) infinite; animation-delay: 2.4s; }

      .sync-target-notion   { animation: syncTargetPulse  2s ease-in-out infinite; animation-delay: 0.9s; }
      .sync-target-obsidian { animation: syncTargetPulse2 2s ease-in-out infinite; animation-delay: 2.1s; }
      .sync-target-ai       { animation: syncTargetPulse3 2s ease-in-out infinite; animation-delay: 3.3s; }

      .sync-connector {
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        animation: syncConnectorPulse 1.8s ease-in-out infinite;
      }
      .sync-connector-2 { animation-delay: 1.2s !important; }
      .sync-connector-3 { animation-delay: 2.4s !important; }

      /* ── Roadmap Road Animation ── */
      @keyframes roadLineDrive {
        0%   { stroke-dashoffset: 36; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes roadCarTravel {
        0%   { left: -70px; opacity: 0; }
        3%   { opacity: 1; }
        97%  { opacity: 1; }
        100% { left: 105%; opacity: 0; }
      }
      @keyframes roadPinPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15)); }
        50%       { transform: scale(1.18); filter: drop-shadow(0 6px 14px rgba(228,245,121,0.6)); }
      }
      @keyframes roadCarBounce {
        0%, 100% { transform: translateY(0); }
        50%       { transform: translateY(-3px); }
      }
      .road-dashed-line {
        stroke-dasharray: 12, 12;
        animation: roadLineDrive 1s linear infinite;
      }
      .road-sticky-car {
        animation: roadCarTravel 9s linear infinite;
      }
      .road-car-body {
        animation: roadCarBounce 0.4s ease-in-out infinite;
      }
      .road-pin-pulse {
        animation: roadPinPulse 2.4s ease-in-out infinite;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
