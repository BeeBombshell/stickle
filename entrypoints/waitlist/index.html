<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waitlist — Stickle Pro & Cloud Sync</title>
    <meta
      name="description"
      content="Join the waitlist for Stickle Pro, Cross-Device Cloud Sync, Remote MCP Server, and Team Web Annotations."
    />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon/16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon/128.png" />

    <!-- Open Graph / Facebook / LinkedIn / Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stickle.beebombshell.com/waitlist" />
    <meta property="og:site_name" content="Stickle" />
    <meta property="og:title" content="Stickle Pro Waitlist — Cross-Device Cloud Sync & Remote MCP" />
    <meta
      property="og:description"
      content="Join the early access waitlist for Stickle Pro: cross-device cloud sync, remote MCP server for Claude/Cursor, and team web annotations."
    />
    <meta property="og:image" content="https://stickle.beebombshell.com/og-image.png" />
    <meta property="og:image:secure_url" content="https://stickle.beebombshell.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stickle — Web Note Anchoring & Cloud Sync" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://stickle.beebombshell.com/waitlist" />
    <meta name="twitter:title" content="Stickle Pro Waitlist — Cross-Device Cloud Sync & Remote MCP" />
    <meta
      name="twitter:description"
      content="Join the early access waitlist for Stickle Pro: cross-device cloud sync, remote MCP server for Claude/Cursor, and team web annotations."
    />
    <meta name="twitter:image" content="https://stickle.beebombshell.com/og-image.png" />
    <meta name="twitter:image:alt" content="Stickle — Web Note Anchoring & Cloud Sync" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #ffffff;
        color: #111111;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Base Layout Utilities */
      .waitlist-wrap {
        width: 100%;
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 24px;
      }

      .waitlist-section-spacing {
        padding: 0 0 96px;
      }

      .waitlist-hero-section {
        padding: 24px 0 96px;
      }

      /* Hero Component Layouts */
      .waitlist-hero-card {
        background-color: #111111;
        color: #ffffff;
        padding: 64px 56px;
        position: relative;
        overflow: hidden;
        border-radius: 28px;
      }

      .waitlist-hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
        gap: 56px;
        align-items: center;
      }

      .waitlist-hero-preview {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px 0;
        min-height: 280px;
      }

      /* Feature Grid */
      .waitlist-feature-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }

      .waitlist-feature-card {
        background-color: #ffffff;
        border: 1px solid #e5e5e0;
        border-radius: 24px;
        padding: 32px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .waitlist-feature-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      }

      /* FAQ Block */
      .waitlist-faq-card {
        background-color: #e4f579;
        border-radius: 24px;
        padding: 56px 48px;
      }

      /* Mobile Navigation Rules */
      .nav-mobile-toggle {
        display: none;
      }

      .nav-desktop-links,
      .nav-desktop-actions {
        display: flex;
      }

      .mobile-menu-drawer {
        display: none;
      }

      /* ── Responsive Breakpoints ────────────────────────────────────────── */
      @media (max-width: 900px) {
        .waitlist-hero-grid {
          grid-template-columns: 1fr;
          gap: 44px;
        }

        .waitlist-hero-card {
          padding: 48px 36px;
          border-radius: 24px;
        }

        .waitlist-faq-card {
          padding: 44px 32px;
        }
      }

      @media (max-width: 768px) {
        .waitlist-wrap {
          padding: 0 16px;
        }

        .waitlist-hero-section {
          padding: 16px 0 64px;
        }

        .waitlist-section-spacing {
          padding: 0 0 64px;
        }

        .nav-desktop-links,
        .nav-desktop-actions {
          display: none !important;
        }

        .nav-mobile-toggle {
          display: inline-flex !important;
          align-items: center;
          justify-content: center;
          background: #f4f4f5;
          border: 1px solid #e4e4e7;
          border-radius: 8px;
          width: 38px;
          height: 38px;
          color: #111111;
          cursor: pointer;
        }

        .mobile-menu-drawer {
          display: flex;
          flex-direction: column;
          position: fixed;
          top: 64px;
          left: 0;
          right: 0;
          bottom: 0;
          background: rgba(255, 255, 255, 0.98);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          z-index: 999;
          padding: 24px 20px;
          overflow-y: auto;
          gap: 8px;
          border-top: 1px solid #e5e5e0;
          animation: mobileFadeIn 0.2s ease-out;
        }

        @keyframes mobileFadeIn {
          from { opacity: 0; transform: translateY(-8px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .waitlist-hero-card {
          padding: 36px 20px;
          border-radius: 20px;
        }

        .waitlist-feature-card {
          padding: 24px 20px;
          border-radius: 20px;
        }

        .waitlist-faq-card {
          padding: 36px 20px;
          border-radius: 20px;
        }

        .waitlist-faq-q-btn {
          padding: 16px 18px !important;
          font-size: 15px !important;
        }

        .waitlist-faq-a-content {
          padding: 0 18px 16px !important;
          font-size: 14px !important;
        }
      }

      @media (max-width: 540px) {
        .waitlist-hero-card {
          padding: 30px 16px;
          border-radius: 16px;
        }

        .waitlist-pills-row {
          display: grid !important;
          grid-template-columns: 1fr 1fr;
          gap: 6px !important;
        }

        .waitlist-pill-btn {
          padding: 7px 10px !important;
          font-size: 12px !important;
          text-align: center;
          white-space: normal !important;
          line-height: 1.2 !important;
        }

        .waitlist-input-group {
          flex-direction: column !important;
          gap: 10px !important;
        }

        .waitlist-email-input {
          width: 100% !important;
          font-size: 16px !important; /* Prevents iOS auto-zoom */
          padding: 12px 16px !important;
        }

        .waitlist-submit-btn {
          width: 100% !important;
          padding: 13px 20px !important;
          text-align: center;
          justify-content: center;
        }

        .waitlist-feature-grid {
          grid-template-columns: 1fr;
          gap: 14px;
        }

        .waitlist-hero-preview {
          transform: scale(0.95);
          transform-origin: center center;
          margin-top: 10px;
        }
      }

      @media (max-width: 380px) {
        .waitlist-hero-preview {
          transform: scale(0.88);
          transform-origin: center center;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
