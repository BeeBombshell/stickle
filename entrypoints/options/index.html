<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stickle — Preferences & Options</title>
    <meta name="description" content="Configure Notion integration, default note appearance, data backup & portability for Stickle." />
    <meta name="theme-color" content="#111111" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon/32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icon/16.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; padding: 0; background-color: #f8f8f6; }
      @media (max-width: 768px) {
        .options-grid {
          grid-template-columns: 1fr !important;
          gap: 20px !important;
          padding: 0 12px !important;
          margin: 16px auto !important;
        }
        .options-nav {
          flex-direction: row !important;
          overflow-x: auto !important;
          padding-bottom: 6px !important;
          -webkit-overflow-scrolling: touch;
          scrollbar-width: none;
        }
        .options-nav::-webkit-scrollbar {
          display: none;
        }
        .options-nav button {
          flex-shrink: 0 !important;
          white-space: nowrap !important;
        }
        .options-backup-grid {
          grid-template-columns: 1fr !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
