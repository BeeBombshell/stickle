<svg width="800" height="340" viewBox="0 0 800 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect width="800" height="340" rx="16" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="42" font-family="Inter, SF Pro Display, system-ui, sans-serif" font-size="20" font-weight="700" fill="#111111">System Architecture & Integrations</text>
  <text x="32" y="64" font-family="Inter, SF Pro Display, system-ui, sans-serif" font-size="13" font-weight="400" fill="#666660">Local-first browser persistence paired with Model Context Protocol (MCP) and Notion export.</text>

  <!-- Box 1: Browser Extension (Left) -->
  <g transform="translate(32, 92)" filter="url(#shadow)">
    <rect width="210" height="210" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="16" y="16" width="178" height="24" rx="12" fill="#1E293B"/>
    <text x="105" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Chrome Extension (MV3)</text>
    
    <!-- Sub-components -->
    <rect x="16" y="52" width="178" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="24" y="73" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#0F172A">content.ts (DOM Anchor)</text>

    <rect x="16" y="94" width="178" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="24" y="115" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#0F172A">popup/ & NoteSidebar</text>

    <rect x="16" y="136" width="178" height="34" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="24" y="157" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#0F172A">background.ts (SW)</text>

    <rect x="16" y="178" width="178" height="20" rx="4" fill="#E4F579"/>
    <text x="105" y="192" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#111111" text-anchor="middle">Preact + WXT Framework</text>
  </g>

  <!-- Arrow Extension -> Storage -->
  <g transform="translate(242, 197)">
    <path d="M 0 0 L 36 0" stroke="#0F172A" stroke-width="2"/>
    <polygon points="36,-4 44,0 36,4" fill="#0F172A"/>
  </g>

  <!-- Box 2: Local Storage Engine (Center) -->
  <g transform="translate(286, 92)" filter="url(#shadow)">
    <rect width="210" height="210" rx="14" fill="#FFF7DB" stroke="#FEF08A" stroke-width="1.5"/>
    <rect x="16" y="16" width="178" height="24" rx="12" fill="#854D0E"/>
    <text x="105" y="32" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Local Storage Engine</text>

    <rect x="16" y="52" width="178" height="42" rx="6" fill="#FFFFFF" stroke="#FEF08A"/>
    <text x="24" y="70" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#111111">Dexie.js (IndexedDB)</text>
    <text x="24" y="85" font-family="JetBrains Mono, monospace" font-size="9" fill="#854D0E">notes table & indices</text>

    <rect x="16" y="104" width="178" height="42" rx="6" fill="#FFFFFF" stroke="#FEF08A"/>
    <text x="24" y="122" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#111111">chrome.storage.local</text>
    <text x="24" y="137" font-family="JetBrains Mono, monospace" font-size="9" fill="#854D0E">User settings & state</text>

    <rect x="16" y="156" width="178" height="42" rx="6" fill="#FFFFFF" stroke="#FEF08A"/>
    <text x="24" y="174" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#111111">~/.stickle/notes.json</text>
    <text x="24" y="189" font-family="JetBrains Mono, monospace" font-size="9" fill="#854D0E">MCP sync file storage</text>
  </g>

  <!-- Arrow Storage -> Right integrations -->
  <g transform="translate(496, 142)">
    <path d="M 0 0 L 44 0" stroke="#0F172A" stroke-width="2"/>
    <polygon points="44,-4 52,0 44,4" fill="#0F172A"/>
  </g>
  <g transform="translate(496, 252)">
    <path d="M 0 0 L 44 0" stroke="#0F172A" stroke-width="2"/>
    <polygon points="44,-4 52,0 44,4" fill="#0F172A"/>
  </g>

  <!-- Box 3: MCP Server (Top Right) -->
  <g transform="translate(548, 92)" filter="url(#shadow)">
    <rect width="220" height="100" rx="12" fill="#E8D5FF" stroke="#D8B4FE" stroke-width="1.5"/>
    <rect x="14" y="12" width="192" height="22" rx="6" fill="#581C87"/>
    <text x="110" y="27" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Model Context Protocol (MCP)</text>
    <text x="14" y="52" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#581C87">mcp-server/index.ts (STDIO)</text>
    <text x="14" y="68" font-family="Inter, sans-serif" font-size="10" fill="#581C87">Connects Claude Desktop, Antigravity,</text>
    <text x="14" y="82" font-family="Inter, sans-serif" font-size="10" fill="#581C87">Cursor & Windsurf AI assistants.</text>
  </g>

  <!-- Box 4: Notion API Integration (Bottom Right) -->
  <g transform="translate(548, 202)" filter="url(#shadow)">
    <rect width="220" height="100" rx="12" fill="#E4F579" stroke="#CBE636" stroke-width="1.5"/>
    <rect x="14" y="12" width="192" height="22" rx="6" fill="#111111"/>
    <text x="110" y="27" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Notion Database Export</text>
    <text x="14" y="52" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#111111">api.notion.com/v1/pages</text>
    <text x="14" y="68" font-family="Inter, sans-serif" font-size="10" fill="#2B3000">Direct 1-click & batch export with</text>
    <text x="14" y="82" font-family="Inter, sans-serif" font-size="10" fill="#2B3000">exponential backoff retry strategy.</text>
  </g>
</svg>
