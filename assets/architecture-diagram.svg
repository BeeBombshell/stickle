<svg width="840" height="360" viewBox="0 0 840 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground Frame -->
  <rect width="840" height="360" rx="16" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="2"/>

  <!-- Title Header -->
  <text x="32" y="42" font-family="Inter, SF Pro Display, system-ui, sans-serif" font-size="20" font-weight="700" fill="#111111">System Architecture &amp; Integrations</text>
  <text x="32" y="64" font-family="Inter, SF Pro Display, system-ui, sans-serif" font-size="13" font-weight="400" fill="#666660">Local-first browser persistence paired with Model Context Protocol (MCP) and Notion export.</text>

  <!-- Box 1: Extension (Left) -->
  <g transform="translate(32, 92)">
    <rect width="210" height="230" rx="14" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="16" y="16" width="178" height="26" rx="6" fill="#1E293B"/>
    <text x="105" y="33" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Chrome Extension (MV3)</text>
    
    <!-- Sub-components -->
    <rect x="16" y="52" width="178" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="26" y="70" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#0F172A">content.ts</text>
    <text x="26" y="82" font-family="Inter, sans-serif" font-size="9" fill="#64748B">5-Tier DOM Anchor Engine</text>

    <rect x="16" y="96" width="178" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="26" y="114" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#0F172A">popup/ &amp; NoteSidebar</text>
    <text x="26" y="126" font-family="Inter, sans-serif" font-size="9" fill="#64748B">Preact UI Manager</text>

    <rect x="16" y="140" width="178" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="26" y="158" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#0F172A">background.ts</text>
    <text x="26" y="170" font-family="Inter, sans-serif" font-size="9" fill="#64748B">Service Worker &amp; Menus</text>

    <rect x="16" y="186" width="178" height="26" rx="6" fill="#E4F579"/>
    <text x="105" y="203" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#111111" text-anchor="middle">Preact + WXT Framework</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(242, 207)">
    <path d="M 0 0 L 38 0" stroke="#0F172A" stroke-width="2"/>
    <polygon points="38,-4 46,0 38,4" fill="#0F172A"/>
  </g>

  <!-- Box 2: Local Storage Engine (Center) -->
  <g transform="translate(288, 92)">
    <rect width="210" height="230" rx="14" fill="#FFFDF0" stroke="#FEF08A" stroke-width="1.5"/>
    <rect x="16" y="16" width="178" height="26" rx="6" fill="#854D0E"/>
    <text x="105" y="33" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Local Storage Engine</text>

    <rect x="16" y="52" width="178" height="42" rx="6" fill="#FFFFFF" stroke="#FEF08A"/>
    <text x="26" y="70" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#111111">Dexie.js (IndexedDB)</text>
    <text x="26" y="85" font-family="JetBrains Mono, monospace" font-size="9" fill="#854D0E">notes table &amp; indices</text>

    <rect x="16" y="102" width="178" height="42" rx="6" fill="#FFFFFF" stroke="#FEF08A"/>
    <text x="26" y="120" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#111111">chrome.storage.local</text>
    <text x="26" y="135" font-family="JetBrains Mono, monospace" font-size="9" fill="#854D0E">Settings &amp; user state</text>

    <rect x="16" y="152" width="178" height="42" rx="6" fill="#FFFFFF" stroke="#FEF08A"/>
    <text x="26" y="170" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#111111">~/.stickle/notes.json</text>
    <text x="26" y="185" font-family="JetBrains Mono, monospace" font-size="9" fill="#854D0E">MCP sync file storage</text>

    <rect x="16" y="200" width="178" height="20" rx="4" fill="#FEF08A"/>
    <text x="105" y="214" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#854D0E" text-anchor="middle">🔒 Local-First &amp; Private</text>
  </g>

  <!-- Arrow Storage -> Right integrations -->
  <g transform="translate(498, 142)">
    <path d="M 0 0 L 42 0" stroke="#0F172A" stroke-width="2"/>
    <polygon points="42,-4 50,0 42,4" fill="#0F172A"/>
  </g>
  <g transform="translate(498, 262)">
    <path d="M 0 0 L 42 0" stroke="#0F172A" stroke-width="2"/>
    <polygon points="42,-4 50,0 42,4" fill="#0F172A"/>
  </g>

  <!-- Box 3: MCP Server (Top Right) -->
  <g transform="translate(548, 92)">
    <rect width="260" height="106" rx="14" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="1.5"/>
    <rect x="14" y="14" width="232" height="24" rx="6" fill="#581C87"/>
    <text x="130" y="30" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Model Context Protocol (MCP)</text>
    <text x="16" y="56" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#581C87">mcp-server/index.ts (STDIO)</text>
    <text x="16" y="74" font-family="Inter, sans-serif" font-size="10" fill="#581C87">Connects Claude Desktop, Antigravity,</text>
    <text x="16" y="88" font-family="Inter, sans-serif" font-size="10" fill="#581C87">Cursor &amp; Windsurf AI desktop assistants.</text>
  </g>

  <!-- Box 4: Notion API Integration (Bottom Right) -->
  <g transform="translate(548, 216)">
    <rect width="260" height="106" rx="14" fill="#F4FCE3" stroke="#CBE636" stroke-width="1.5"/>
    <rect x="14" y="14" width="232" height="24" rx="6" fill="#111111"/>
    <text x="130" y="30" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Notion Database Export</text>
    <text x="16" y="56" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#111111">api.notion.com/v1/pages</text>
    <text x="16" y="74" font-family="Inter, sans-serif" font-size="10" fill="#2B3000">1-click manual &amp; batch note export</text>
    <text x="16" y="88" font-family="Inter, sans-serif" font-size="10" fill="#2B3000">with exponential backoff retry client.</text>
  </g>
</svg>
