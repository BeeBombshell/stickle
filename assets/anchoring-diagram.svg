<svg width="1000" height="330" viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground Canvas Frame -->
  <rect width="1000" height="330" rx="16" fill="#FFFFFF" stroke="#E5E5E0" stroke-width="2"/>

  <!-- Title & Subtitle -->
  <text x="32" y="42" font-family="Inter, SF Pro Display, system-ui, sans-serif" font-size="20" font-weight="700" fill="#111111">5-Tier Resilient DOM Anchoring Pipeline</text>
  <text x="32" y="64" font-family="Inter, SF Pro Display, system-ui, sans-serif" font-size="13" font-weight="400" fill="#666660">How Stickle guarantees sticky note persistence across page reloads, DOM mutations, structural refactors, and copy updates.</text>

  <!-- Step 0: Fingerprint (Tier 0) -->
  <g transform="translate(32, 88)">
    <rect width="142" height="210" rx="12" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="12" y="12" width="60" height="20" rx="10" fill="#E4F579"/>
    <text x="42" y="26" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#111111" text-anchor="middle">TIER 0</text>
    <text x="12" y="56" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Fingerprint</text>
    <rect x="12" y="68" width="118" height="28" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="18" y="86" font-family="JetBrains Mono, monospace" font-size="9" fill="#E4F579">domIndex + hash</text>
    <text x="12" y="114" font-family="Inter, sans-serif" font-size="10" fill="#94A3B8">
      <tspan x="12" dy="0">O(1) ordinal lookup</tspan>
      <tspan x="12" dy="15">validated against</tspan>
      <tspan x="12" dy="15">60-char text hash.</tspan>
    </text>
    <rect x="12" y="174" width="118" height="22" rx="4" fill="#0F172A" stroke="#334155"/>
    <text x="71" y="188" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="#E4F579" text-anchor="middle">🎯 Primary Match</text>
  </g>

  <!-- Arrow 0 -> 1 -->
  <g transform="translate(174, 193)">
    <path d="M 0 0 L 12 0" stroke="#94A3B8" stroke-width="2" stroke-dasharray="2 2"/>
    <polygon points="12,-3 18,0 12,3" fill="#64748B"/>
  </g>

  <!-- Step 1: Selector (Tier 1) -->
  <g transform="translate(192, 88)">
    <rect width="142" height="210" rx="12" fill="#FFFDF0" stroke="#FEF08A" stroke-width="1.5"/>
    <rect x="12" y="12" width="60" height="20" rx="10" fill="#FEF08A"/>
    <text x="42" y="26" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#854D0E" text-anchor="middle">TIER 1</text>
    <text x="12" y="56" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#111111">CSS Selector</text>
    <rect x="12" y="68" width="118" height="28" rx="6" fill="#FFFFFF" stroke="#FEF08A"/>
    <text x="18" y="86" font-family="JetBrains Mono, monospace" font-size="9" fill="#854D0E">#hero &gt; h1.title</text>
    <text x="12" y="114" font-family="Inter, sans-serif" font-size="10" fill="#52514E">
      <tspan x="12" dy="0">Fast exact DOM</tspan>
      <tspan x="12" dy="15">query matching</tspan>
      <tspan x="12" dy="15">via querySelector.</tspan>
    </text>
    <rect x="12" y="174" width="118" height="22" rx="4" fill="#FEF08A"/>
    <text x="71" y="188" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="#854D0E" text-anchor="middle">⚡ 99.8% Precision</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(334, 193)">
    <path d="M 0 0 L 12 0" stroke="#A1A1AA" stroke-width="2" stroke-dasharray="2 2"/>
    <polygon points="12,-3 18,0 12,3" fill="#71717A"/>
  </g>

  <!-- Step 2: Text Fragment (Tier 2) -->
  <g transform="translate(352, 88)">
    <rect width="142" height="210" rx="12" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="1.5"/>
    <rect x="12" y="12" width="60" height="20" rx="10" fill="#D8B4FE"/>
    <text x="42" y="26" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#581C87" text-anchor="middle">TIER 2</text>
    <text x="12" y="56" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#111111">Text Fragment</text>
    <rect x="12" y="68" width="118" height="28" rx="6" fill="#FFFFFF" stroke="#D8B4FE"/>
    <text x="18" y="86" font-family="JetBrains Mono, monospace" font-size="9" fill="#581C87">prefix:exact:suffix</text>
    <text x="12" y="114" font-family="Inter, sans-serif" font-size="10" fill="#52514E">
      <tspan x="12" dy="0">W3C Text Quote.</tspan>
      <tspan x="12" dy="15">Survives class/ID</tspan>
      <tspan x="12" dy="15">layout refactors.</tspan>
    </text>
    <rect x="12" y="174" width="118" height="22" rx="4" fill="#D8B4FE"/>
    <text x="71" y="188" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="#581C87" text-anchor="middle">🛡️ Layout Resilient</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(494, 193)">
    <path d="M 0 0 L 12 0" stroke="#A1A1AA" stroke-width="2" stroke-dasharray="2 2"/>
    <polygon points="12,-3 18,0 12,3" fill="#71717A"/>
  </g>

  <!-- Step 3: Fuzzy Match (Tier 3) -->
  <g transform="translate(512, 88)">
    <rect width="142" height="210" rx="12" fill="#F4FCE3" stroke="#CBE636" stroke-width="1.5"/>
    <rect x="12" y="12" width="60" height="20" rx="10" fill="#CBE636"/>
    <text x="42" y="26" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#3D4400" text-anchor="middle">TIER 3</text>
    <text x="12" y="56" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#111111">Fuzzy Search</text>
    <rect x="12" y="68" width="118" height="28" rx="6" fill="#FFFFFF" stroke="#CBE636"/>
    <text x="18" y="86" font-family="JetBrains Mono, monospace" font-size="9" fill="#3D4400">Trigram Dice match</text>
    <text x="12" y="114" font-family="Inter, sans-serif" font-size="10" fill="#2B3000">
      <tspan x="12" dy="0">Sub-string similarity.</tspan>
      <tspan x="12" dy="15">Survives minor copy</tspan>
      <tspan x="12" dy="15">edits and typos.</tspan>
    </text>
    <rect x="12" y="174" width="118" height="22" rx="4" fill="#CBE636"/>
    <text x="71" y="188" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="#3D4400" text-anchor="middle">🔍 Copy-Edit Safe</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g transform="translate(654, 193)">
    <path d="M 0 0 L 12 0" stroke="#A1A1AA" stroke-width="2" stroke-dasharray="2 2"/>
    <polygon points="12,-3 18,0 12,3" fill="#71717A"/>
  </g>

  <!-- Step 4: Coordinates (Tier 4) -->
  <g transform="translate(672, 88)">
    <rect width="142" height="210" rx="12" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.5"/>
    <rect x="12" y="12" width="60" height="20" rx="10" fill="#FBCFE8"/>
    <text x="42" y="26" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#9D174D" text-anchor="middle">TIER 4</text>
    <text x="12" y="56" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#111111">Coordinates</text>
    <rect x="12" y="68" width="118" height="28" rx="6" fill="#FFFFFF" stroke="#FBCFE8"/>
    <text x="18" y="86" font-family="JetBrains Mono, monospace" font-size="9" fill="#9D174D">pageX / pageY</text>
    <text x="12" y="114" font-family="Inter, sans-serif" font-size="10" fill="#831843">
      <tspan x="12" dy="0">Absolute document</tspan>
      <tspan x="12" dy="15">coords at creation.</tspan>
      <tspan x="12" dy="15">Scroll-independent.</tspan>
    </text>
    <rect x="12" y="174" width="118" height="22" rx="4" fill="#FBCFE8"/>
    <text x="71" y="188" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="#9D174D" text-anchor="middle">📍 Position Lock</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <g transform="translate(814, 193)">
    <path d="M 0 0 L 12 0" stroke="#A1A1AA" stroke-width="2" stroke-dasharray="2 2"/>
    <polygon points="12,-3 18,0 12,3" fill="#71717A"/>
  </g>

  <!-- Step 5: Fallback (Tier 5) -->
  <g transform="translate(832, 88)">
    <rect width="136" height="210" rx="12" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1.5"/>
    <rect x="12" y="12" width="60" height="20" rx="10" fill="#E4E4E7"/>
    <text x="42" y="26" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#52525B" text-anchor="middle">FALLBACK</text>
    <text x="12" y="56" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#111111">Unanchored</text>
    <rect x="12" y="68" width="112" height="28" rx="6" fill="#FFFFFF" stroke="#E4E4E7"/>
    <text x="18" y="86" font-family="JetBrains Mono, monospace" font-size="9" fill="#52525B">Page float</text>
    <text x="12" y="114" font-family="Inter, sans-serif" font-size="10" fill="#52525B">
      <tspan x="12" dy="0">Pinned to page</tspan>
      <tspan x="12" dy="15">bottom-right.</tspan>
      <tspan x="12" dy="15">Never loses content.</tspan>
    </text>
    <rect x="12" y="174" width="112" height="22" rx="4" fill="#E4E4E7"/>
    <text x="68" y="188" font-family="JetBrains Mono, monospace" font-size="8" font-weight="700" fill="#52525B" text-anchor="middle">📌 Safe Pin</text>
  </g>
</svg>
